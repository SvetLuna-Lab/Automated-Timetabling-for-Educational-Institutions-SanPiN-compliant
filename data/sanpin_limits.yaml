# data/sanpin_limits.yaml

# Максимальное число уроков в день по ступеням (примерные значения)
max_lessons_per_day_by_grade:
  "5": 6
  "6": 6
  "7": 7

# Максимальная суточная нагрузка в баллах (пример для проекта)
max_points_per_day_by_grade:
  "5": 20
  "6": 22
  "7": 24

# Профиль распределения нагрузки по дням недели
# Коэффициенты задают "желательную" относительную нагрузку:
# Пн — полегче, Вт/Ср — пик, Чт — средний, Пт — облегченный.
target_load_profile:
  monday: 0.8
  tuesday: 1.1
  wednesday: 1.1
  thursday: 1.0
  friday: 0.7

# Номера уроков (слоты) в учебном дне
slots_per_day: 6

# Тяжёлые предметы, которые нельзя ставить на последние уроки
heavy_subject_ids:
  - "math"
  - "foreign"
  - "history"
